name: Dashboard and protocol checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify downloadable packages match source
        run: python scripts/build_downloads.py --check
      - name: Check dashboard, plotting and extracted C protocol functions
        working-directory: CCS_Import_Projects
        run: python -m unittest discover -p 'test_*.py'
